name: Canary CI

# Runs the same checks as CI against code generated from the canary specs.
# sdk-codegen force-pushes these branches; they are never released, so there is
# no publish job.
on:
  workflow_dispatch: {}
  push:
    branches:
      - canary-ga
      - canary-beta
      - canary-private-preview

permissions: {}

concurrency:
  # Each push replaces the branch, so an older run's result is stale.
  group: canary-ci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Map each canary branch to the channel stripe-mock serves.
  CANARY_CHANNEL: >-
    ${{
      github.ref_name == 'canary-ga' && 'ga' ||
      github.ref_name == 'canary-beta' && 'beta' ||
      github.ref_name == 'canary-private-preview' && 'private-preview' ||
      'unsupported'
    }}

jobs:
  lint:
    name: Lint

    runs-on: "ubuntu-24.04"

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lint

  govulncheck:
    name: govulncheck
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/govulncheck

  test:
    name: "Test: go v${{ matrix.go }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the test matrix in ci.yml.
        os:
          - "ubuntu-24.04"
        go:
          # Supported Go versions
          # https://docs.stripe.com/sdks/versioning?lang=go#stripe-sdk-language-version-support-policy
          # https://endoflife.date/go
          - "1.26"
          - "1.25"
          - "1.24"
        include:
          - os: windows-latest
            # use any modern-ish version
            go: "1.26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test
        with:
          go-version: ${{ matrix.go }}
          canary_channel: ${{ env.CANARY_CHANNEL }}
