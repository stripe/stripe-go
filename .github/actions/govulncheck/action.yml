name: govulncheck
description: Scan dependencies for known vulnerabilities. Shared by CI and Canary CI; expects the repository to be checked out.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.26"
        check-latest: true
        # Saves ~15s installing govulncheck, on a job that never reaches the
        # critical path. Not worth keeping a cache in a third job for.
        cache: false
    - name: Install govulncheck
      shell: bash
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
    - name: Run vulnerability scan
      shell: bash
      run: govulncheck ./...
