name: Lint
description: Run golangci-lint and check formatting. Shared by CI and Canary CI; expects the repository to be checked out.

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Setup go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.26"
        # Measured at no benefit: golangci-lint runs off its own cache, which
        # golangci-lint-action manages, not the Go build cache.
        cache: false

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.11.4

    - name: lint
      shell: bash
      run: |
        just format-check
